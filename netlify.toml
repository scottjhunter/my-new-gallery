[build]
    # Directory (relative to root of your repo) that contains the deploy-ready HTML files
    publish = "_site"
    
    # Build command
    command = "npm run build"

[build.processing.html]
    pretty_urls = true

# Keep one public origin. Pretty URLs adds slashes only to live pages.
[[redirects]]
    from = "http://scottjhunter.org/*"
    to = "https://scottjhunter.org/:splat"
    status = 301
    force = true

